  secondary_role: exact_fixed_primary_path_energy_force_inference_only
  executor: scripts/dual_model_ml_neb.py
  gpu_job_wrapper: scripts/dual_model_ml_neb_job.sh
  preconditioning:
    temporary_bilateral_harmonic_bond_restraints: allowed
    restraints_must_be_removed_before_ordinary_ml_neb: true
    constrained_output_is_mep: false
  model_comparison:
    identical_structure_hashes_required: true
    raw_cross_model_absolute_energy_comparison: forbidden
    disagreement_status: sampling_score_not_calibrated_uncertainty
  active_learning:
    policy: configs/dual_model_ts_active_learning.yaml
    exact_dual_model_prediction_runner: scripts/dual_model_ts_force_prediction_batch.py
    matris_committee_runner: scripts/matris_ts_path_committee.py
    vasp_label_selector: scripts/select_dual_model_ts_vasp_labels.py
    vasp_error_assessor: scripts/assess_dual_model_ts_vasp_errors.py
    committee_minimum_members: 3
    committee_maximum_members: 5
    committee_fallback: matris_primary_plus_optional_aqcat25_audit_plus_vasp_error
    failure_boundary_pair_required_when_available: true
    vasp_labels_require_energy_forces_and_magnetic_moments: true
    automatic_local_preparation: true
    automatic_remote_submission: false
  smoke_test:
    accepted_job_id: "1317"
    review: calculations/fe110_c2ho_h_to_c2h2o_ts_20260822/gpu_dual_model_smoke_v3_20260825/smoke_review.work.json
  automatic_submission: forbidden
  production_gpu_request_requires_separate_user_authorization: true

aqcat25_ts_active_learning:
