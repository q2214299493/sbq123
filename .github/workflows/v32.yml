name: V3.2 installed packages
on:
  push:
    paths: ["src/**", "packages/**", "tests/v32/**", "tools/v32/**", ".github/workflows/v32.yml"]
  pull_request:
    paths: ["src/**", "packages/**", "tests/v32/**", "tools/v32/**", ".github/workflows/v32.yml"]
  workflow_dispatch:
jobs:
  architecture:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install setuptools==80.9.0 wheel==0.45.1
      - run: python tools/v32/architecture_gate.py "${{ runner.temp }}/core-gate"
      - uses: actions/upload-artifact@v4
        with:
          name: core-gate-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/core-gate/*.xml
            ${{ runner.temp }}/core-gate/*.json
  install:
    needs: architecture
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        role: [common, mkm, kmc, reactor, reactor-dynamic]
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_DATE_EPOCH: "1795600000"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install setuptools==80.9.0 wheel==0.45.1
      - run: python tools/v32/ci.py ${{ matrix.role }} "${{ runner.temp }}/v32-check"
      - uses: actions/upload-artifact@v4
        with:
          name: v32-${{ matrix.os }}-${{ matrix.role }}
          path: |
            ${{ runner.temp }}/v32-check/history/junit.xml
            ${{ runner.temp }}/v32-check/installed.json
            ${{ runner.temp }}/v32-check/reactor.xml

