  controller: scripts/ts_strategy_engine/cli.py
  entrypoint: python -m scripts.ts_strategy_engine.cli active-learning
  # The standalone module is a compatibility wrapper; all new invocations use
  # ``python -m scripts.ts_strategy_engine.cli active-learning``.
