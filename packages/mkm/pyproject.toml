[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sbq123-mkm"
version = "3.2.0"
requires-python = ">=3.13,<3.14"
dependencies = ["sbq123-common==3.2.0", "scipy>=1.15,<2", "astropy>=6,<8"]

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["sbq123.mkm", "sbq123.mkm.*"]
exclude = ["*.resources.*", "*.resources", "*.__pycache__"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"sbq123.mkm" = ["_legacy_modules.json", "_data_hashes.json", "resources/**/*", "registries/*.json"]

[project.scripts]
sbq123-mkm-repo-state = "sbq123.mkm.cli:repo_state"
sbq123-mkm-registry-promote = "sbq123.mkm.cli:registry_promote"
sbq123-mkm-registry-write = "sbq123.mkm.cli:registry_write"
sbq123-mkm-registry-init = "sbq123.mkm.cli:registry_init"
sbq123-mkm-ts-strategy = "sbq123.mkm.cli:ts_strategy"
sbq123-mkm-document-governance = "sbq123.mkm.cli:document_governance"
sbq123-mkm-capability-readiness = "sbq123.mkm.cli:capability_readiness"
sbq123-mkm-catalysis-search = "sbq123.mkm.cli:catalysis_search"
sbq123-mkm-catalysis-validate = "sbq123.mkm.cli:catalysis_validate"

[project.optional-dependencies]
geometry = ["ase>=3.29,<4"]
