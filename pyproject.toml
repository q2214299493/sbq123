[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sbq-catalyst-agent-workflow"
version = "0.1.0"
description = "Repository tooling for the Fe(110) computational-catalysis workflow"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.25,<5",
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
]

[project.scripts]
repo-state = "scripts.state_manager.cli:main"
registry-promote = "scripts.registry_excel_promotion:main"
registry-write = "scripts.registry_write:main"

[project.optional-dependencies]
adsmind = [
  "ase>=3.23,<4",
]
neb = [
  "ase>=3.23,<4",
]
sella = [
  "sella==2.6.0",
]
visualization = [
  "matplotlib>=3.8,<4",
]
retrieval = [
  "sentence-transformers==5.6.0",
]
dev = [
  "pymatgen>=2024.5,<2027",
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["scripts", "scripts.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = [
  "archive",
  "modules/memory_migration",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15
