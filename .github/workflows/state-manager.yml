name: Repository and release validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,neb,sella]"
      - run: python -c "import sella; from pymatgen.io.vasp.inputs import Incar"
      - run: python -m ruff check scripts modules tests
      - run: python -m pytest -o addopts= -q

  engineering:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,neb]"
      - run: python -m pytest -o addopts= -q tests/test_artifact_io.py tests/test_execution_lifecycle.py tests/test_execution_backends.py tests/test_registry_write.py tests/test_b4_registry_governance.py tests/test_b4_state_governance.py tests/test_registry_schema.py tests/test_state_manager.py tests/test_b5_architecture_boundaries.py tests/test_b6_governance.py tests/test_b7_release.py

  wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ".[release]"
      - run: python -m scripts.validate_release --source . --output "${{ runner.temp }}/release-validation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-environment-${{ matrix.os }}-py311
          path: |
            ${{ runner.temp }}/release-validation/*.json
            ${{ runner.temp }}/release-validation/*.log
